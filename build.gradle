tasks.register('testJava', GradleBuild) {
    dir = file('java')
    tasks = ['test']
}

tasks.register('testKotlin', GradleBuild) {
    dir = file('kotlin')
    tasks = ['test']
}

tasks.register('buildJava', GradleBuild) {
    dir = file('java')
    tasks = ['build']
}

tasks.register('buildKotlin', GradleBuild) {
    dir = file('kotlin')
    tasks = ['build']
}

tasks.register('testAll') {
    group = 'verification'
    description = 'Runs tests across both Java and Kotlin projects'
    dependsOn 'testJava', 'testKotlin'
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds all Java and Kotlin projects'
    dependsOn 'buildJava', 'buildKotlin'
}

tasks.matching { it.name == 'test' }.configureEach {
    group = 'verification'
    description = 'Runs tests across all projects (alias for testAll)'
    dependsOn 'testAll'
}

if (tasks.findByName('test') == null) {
    tasks.register('test') {
        group = 'verification'
        description = 'Runs tests across all projects (alias for testAll)'
        dependsOn 'testAll'
    }
}
